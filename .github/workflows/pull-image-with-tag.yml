name: pull-image-with-tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Will pull image tag'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  pull_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up Docker to free space
        run: |
          docker system prune -a -f
          docker volume prune -f
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push all platform images
        run: |
          image_name="${{ github.ref_name }}:${{ inputs.tag }}"
          full_image_name=${{ env.REGISTRY }}/${{ github.actor }}/${{ github.ref_name }}:${{ inputs.tag }}
          echo "image name is: $image_name, full image name is: $full_image_name"

          # Enable experimental features for manifest operations
          export DOCKER_CLI_EXPERIMENTAL=enabled

          # Get all supported platforms from the source image manifest
          platforms=$(docker manifest inspect "$image_name" | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u)
          echo "Supported platforms: $platforms"

          # Use buildx imagetools to create and push a multi-platform image
          docker buildx imagetools create \
            --tag "$full_image_name" \
            "$image_name"

          echo "Multi-platform image pushed successfully"