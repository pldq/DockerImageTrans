name: trans-on-create-branch
on:
  create

env:
  REGISTRY: ghcr.io

jobs:
  pull_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up Docker to free space
        run: |
          docker system prune -a -f --volumes
          docker volume prune -f
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push all platform images
        run: |
          image_name="${{ github.ref_name }}"
          full_image_name=${{ env.REGISTRY }}/${{ github.actor }}/$image_name
          echo "image name is: $image_name, full image name is: $full_image_name"

          # Enable experimental features for manifest operations
          export DOCKER_CLI_EXPERIMENTAL=enabled

          # Get all supported platforms from the source image manifest
          platforms=$(docker manifest inspect "$image_name" | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u)
          echo "Supported platforms: $platforms"

          # Build platform list for buildx (comma-separated)
          platform_list=$(echo "$platforms" | tr '\n' ',' | sed 's/,$//')
          echo "Platform list: $platform_list"

          # Use buildx imagetools to create and push a multi-platform image
          docker buildx imagetools create \
            --tag "$full_image_name" \
            "$image_name"

          echo "Multi-platform image pushed successfully"